<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Enterprise Recruitment Intelligence OS - A layered AI-native workforce platform." />
    <title>HireNestOS</title>
    <script>
      (function() {
        var g = typeof window !== 'undefined' ? window : self;
        if (!g.process) {
          g.process = {
            env: { NODE_ENV: 'production', GOOGLE_SDK_NODE_LOGGING: 'false' },
            argv: [],
            platform: 'browser',
            nextTick: function(fn) { setTimeout(fn, 0); }
          };
        } else if (!g.process.env) {
          g.process.env = { NODE_ENV: 'production', GOOGLE_SDK_NODE_LOGGING: 'false' };
        } else {
          g.process.env.GOOGLE_SDK_NODE_LOGGING = g.process.env.GOOGLE_SDK_NODE_LOGGING || 'false';
          g.process.env.NODE_ENV = g.process.env.NODE_ENV || 'production';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
