<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Enterprise Recruitment Intelligence OS - A layered AI-native workforce platform." />
    <title>HireNestOS</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function() {
        if (typeof window.process === 'undefined') {
          window.process = {
            env: { NODE_ENV: 'production', GOOGLE_SDK_NODE_LOGGING: 'false' }
          };
        } else if (typeof window.process.env === 'undefined') {
          window.process.env = { NODE_ENV: 'production', GOOGLE_SDK_NODE_LOGGING: 'false' };
        } else {
          // Ensure the required keys are present without overwriting existing environment variables
          if (typeof window.process.env.GOOGLE_SDK_NODE_LOGGING === 'undefined') {
            window.process.env.GOOGLE_SDK_NODE_LOGGING = 'false';
          }
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
